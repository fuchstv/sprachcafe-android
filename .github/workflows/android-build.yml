name: Build & Release SprachCafe Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sprachcafe2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sprachcafe2026' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprachcafe-team-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SprachCafé Team App v1.0.0 (${{ github.run_number }})
          body: |
            ### ☕ SprachCafé Team & Betriebs-App (Android BYOD)
            
            **Neue Funktionen in diesem Release:**
            * ☕ **Kiosk & Café Kasse:** Große Kacheln für alle 18 Café- & Kioskartikel, Strichlisten-Buchung & Barverkauf.
            * 📸 **Kamera-Barcode-Scanner:** Integrierter Google ML Kit EAN-13 Scanner für Flaschen & Snacks (100% on-device).
            * 🧮 **Digitaler Kassensturz:** Automatischer Tagesabschluss mit 50,00 € Wechselgeldsockel & Differenzermittlung.
            * 📋 **GoBD-Minderungsprotokoll:** Finanzamt-Nachweis für Schwund, MHD-Ablauf und Helferverpflegung.
            * 📚 **Hausbibliothek Scanner:** ISBN-Kamera-Scan zur Bestandsabfrage und Ausleihe am Bücherregal.
            
            **Installation:** APK herunterladen, öffnen und „Installieren“ antippen.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

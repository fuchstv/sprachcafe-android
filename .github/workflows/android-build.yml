name: Build & Release SprachCafe Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK & App Bundle (AAB)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'sprachcafe2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sprachcafe2026' }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: sprachcafe-team-release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: SprachCafé Team App v1.0.0 (${{ github.run_number }})
          body: |
            ### ☕ SprachCafé Team & Betriebs-App (Android BYOD)
            
            **Pakete in diesem Release:**
            * 📦 **app-release.aab:** Android App Bundle für den **Google Workspace Play Store (Managed Google Play)** – voll kompatibel mit dem **Erweiterten Sicherheitsprogramm**!
            * 📲 **app-release.apk:** Eigenständiges Installationspaket für Sideloading.
            
            **Enthaltene Module:**
            * ☕ **Kiosk & Café Kasse:** 18 Vereins- & Café-Artikel, Barverkauf & Strichlisten.
            * 📸 **Kamera-Barcode-Scanner:** On-Device Google ML Kit Scanner für EAN-13 Flaschen & Snacks.
            * 🧮 **Digitaler Kassensturz:** Tagesabschluss mit 50,00 € Sockel.
            * 📋 **GoBD-Minderung:** Nachweis für Schwund, MHD & Helferverpflegung.
            * 📚 **Hausbibliothek:** ISBN-Scanner & Ausleihbuchung für 400+ Bücher.
            
            **Installation:**
            * **Im Google Workspace:** Das `.aab` in der Google Admin Console als Private App hochladen.
            * **Direkt:** Das `.apk` herunterladen und installieren.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Google Play (Automated 0-Click Deployment)
        if: ${{ env.HAS_PLAY_KEY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.sprachcafe.team
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: production
          status: completed
        env:
          HAS_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
